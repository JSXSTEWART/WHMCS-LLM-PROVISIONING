# Prometheus Configuration
# Collects and stores metrics from all services and containers

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'llm-provisioning'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alert rules
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Docker Daemon metrics via cAdvisor
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Portainer metrics
  - job_name: 'portainer'
    static_configs:
      - targets: ['portainer:9000']
    metrics_path: '/metrics'
    scheme: 'https'
    tls_config:
      insecure_skip_verify: true

  # Node Exporter metrics (system level)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 30s

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-cache:6379']
    scrape_interval: 30s

  # LLM Container service discovery
  # Automatically discovers and monitors running LLM containers
  - job_name: 'llm-containers'
    consul_sd_configs:
      - server: 'localhost:8500'
    relabel_configs:
      - source_labels: [__meta_consul_service]
        target_label: service
      - source_labels: [__meta_consul_node]
        target_label: instance
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    scheme: 'http'

  # GPU metrics (if NVIDIA GPUs available)
  - job_name: 'gpu-metrics'
    static_configs:
      - targets: ['localhost:9113']
    scrape_interval: 30s
    honor_timestamps: true

  # NVIDIA DCGM (Data Center GPU Manager) metrics
  - job_name: 'nvidia-dcgm'
    static_configs:
      - targets: ['localhost:5555']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # Application logs via Promtail (Loki integration)
  - job_name: 'promtail'
    static_configs:
      - targets: ['localhost:3101']
    scrape_interval: 30s

  # Custom application metrics endpoint
  - job_name: 'llm-app-metrics'
    static_configs:
      - targets: ['localhost:8888']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # Service discovery for dynamic environments
  - job_name: 'docker-swarm'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: nodes
    relabel_configs:
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance
    scrape_interval: 30s
